name: Build Site Tools

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine pyinstaller

      - name: Download git (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sL --retry 5 --retry-delay 15 --max-time 300 -o git-linux.tar.gz \
            https://github.com/darkvertex/static-git/releases/latest/download/git-binaries.linux-64bit.tar.gz
          mkdir -p bundled-git
          tar -xzf git-linux.tar.gz -C bundled-git
          chmod +x bundled-git/*
          rm git-linux.tar.gz
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Strip Linux git
        if: runner.os == 'Linux'
        run: |
          echo "Before stripping:"
          du -sh bundled-git/
          for f in bundled-git/*; do
            [ "$(basename "$f")" = "git" ] || rm -f "$f"
          done
          echo "After stripping:"
          du -sh bundled-git/
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Download MinGit (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sL --retry 5 --retry-delay 15 --max-time 300 -o mingit.zip \
            https://github.com/git-for-windows/git/releases/download/v2.48.1.windows.1/MinGit-2.48.1-64-bit.zip
          unzip -q mingit.zip -d mingit
          rm mingit.zip
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Strip MinGit (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "Before stripping:"
          du -sh mingit/

          # Remove GCM — ~28 MB
          rm -rf mingit/mingw64/bin/git-credential-manager*
          for prefix in Avalonia SkiaSharp HarfBuzzSharp Microsoft. System. gcmcore GitHub. GitLab. Atlassian. MicroCom. msalruntime MSAL; do
            rm -f mingit/mingw64/bin/"${prefix}"*
          done

          # Remove scalar.exe + headless-git.exe
          rm -f mingit/mingw64/bin/scalar.exe mingit/mingw64/bin/headless-git.exe
          rm -f mingit/cmd/scalar.exe mingit/cmd/tig.exe

          # Remove cmd/ wrappers, usr/ (MSYS2), etc/ssh, libexec/, docs/licenses
          rm -rf mingit/cmd mingit/usr mingit/etc/ssh mingit/mingw64/libexec
          rm -rf mingit/mingw64/doc mingit/mingw64/share mingit/LICENSE.txt

          # Remove non-essential standalone utilities
          for f in brotli.exe psl.exe proxy-lookup.exe blocked-file-util.exe \
                   c_rehash git-update-git-for-windows git-askpass.exe \
                   git-askyesno.exe git-credential-helper-selector.exe; do
            rm -f mingit/mingw64/bin/"$f"
          done

          echo "After stripping:"
          du -sh mingit/
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Download FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sL --retry 5 --retry-delay 15 --max-time 600 -o ffmpeg-linux.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz || \
          curl -sL --retry 3 --retry-delay 10 --max-time 600 -o ffmpeg-linux.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-linux64-gpl-7.1.tar.xz
          mkdir -p ffmpeg
          if tar -tJf ffmpeg-linux.tar.xz >/dev/null 2>&1; then
            tar -xJf ffmpeg-linux.tar.xz -C ffmpeg --strip-components=1 --wildcards '*/ffmpeg'
          else
            tar -xJf ffmpeg-linux.tar.xz -C ffmpeg --wildcards '*/ffmpeg' --strip-components=2
          fi
          chmod +x ffmpeg/ffmpeg
          rm ffmpeg-linux.tar.xz
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Download FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sL --retry 5 --retry-delay 15 --max-time 600 -o ffmpeg-win.zip \
            https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          mkdir -p ffmpeg
          unzip -j ffmpeg-win.zip "*/bin/ffmpeg.exe" -d ffmpeg
          rm ffmpeg-win.zip
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Download CKEditor
        run: |
          mkdir -p ckeditor
          curl -sL --retry 5 --retry-delay 10 --max-time 120 -o ckeditor/ckeditor5.umd.js \
            https://cdn.ckeditor.com/ckeditor5/42.0.0/ckeditor5.umd.js
          curl -sL --retry 5 --retry-delay 10 --max-time 120 -o ckeditor/ckeditor5.css \
            https://cdn.ckeditor.com/ckeditor5/42.0.0/ckeditor5.css
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Install UPX
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get install -y upx-ucl
          else
            curl -sL --retry 5 --retry-delay 10 --max-time 120 -o upx.zip \
              https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip
            unzip -q upx.zip -d upx-bin
            UPX_DIR=$(find upx-bin -name upx.exe -exec dirname {} \;)
            echo "$UPX_DIR" >> $GITHUB_PATH
            rm upx.zip
          fi
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Build executable
        run: |
          DATA_ARGS=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            DATA_ARGS="--add-data mingit;mingit --add-data ckeditor;ckeditor --add-data ffmpeg;ffmpeg"
            [ -f logo.ico ] && ICON_ARGS="--icon logo.ico"
            [ -f version_info.txt ] && ICON_ARGS="$ICON_ARGS --version-file version_info.txt"
          else
            DATA_ARGS="--add-data bundled-git:bundled-git --add-data ckeditor:ckeditor --add-data ffmpeg:ffmpeg"
            ICON_ARGS="--icon logo.png"
          fi
          EXCLUDE=""
          for mod in tkinter test distutils idlelib ensurepip lib2to3 unittest pydoc xmlrpc turtledemo zipapp http.server; do
            EXCLUDE="$EXCLUDE --exclude-module $mod"
          done
          pyinstaller --onefile --name SiteTools --optimize 2 \
            --hidden-import PyQt6.sip \
            --hidden-import PyQt6.QtWebEngineWidgets \
            --hidden-import PyQt6.QtWebEngineCore \
            --hidden-import docx2html \
            --hidden-import sidebar_util \
            --hidden-import first_run \
            --hidden-import advanced_theme \
            --hidden-import git_util \
            --hidden-import bootstrap \
            $DATA_ARGS $EXCLUDE $ICON_ARGS app.py
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiteTools-${{ runner.os }}
          path: dist/SiteTools*
